server {
    listen 80;
    server_name capturviagens.com.br www.capturviagens.com.br;

    # Redireciona HTTP para HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name capturviagens.com.br www.capturviagens.com.br;

    ssl_certificate /etc/letsencrypt/live/capturviagens.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/capturviagens.com.br/privkey.pem;

    # Segurança SSL
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # App Mobile Client
    location / {
        proxy_pass http://localhost:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Painel Web Admin (Paula)
    location /admin {
        proxy_pass http://localhost:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # API REST Backend
    location /api/ {
        proxy_pass http://localhost:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
